version: '3.8'

services:
  medical_field_core:
    build:
      context: ./backend/core
    ports:
      - "8080:8080"
    volumes:
      - ./databases:/app/databases
    depends_on:
      - postgres

  medical_field_tracing:
    build:
      context: ./backend/tracing
    ports:
      - "8081:8081"

  medical_field_communication:
    build:
      context: ./backend/communication
    ports:
      - "8082:8082"

  medical_field_frontend:
    build:
      context: ./frontend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000